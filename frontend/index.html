<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Q2A Question Assistant</title>
  </head>

  <body>
    <main class="app">
      <section id="auth-view" class="auth-card panel" hidden>
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">Q2A</span>
          <span>Q2A Question Assistant</span>
        </div>

        <h1 id="form-title">Welcome back</h1>
        <p id="form-intro" class="muted">Log in to continue.</p>
        <p id="status" class="notice" role="status">Checking your session…</p>

        <form id="auth-form">
          <label for="email">Email</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            maxlength="254"
            required
          />

          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="128"
            placeholder="Enter your password"
            required
          />

          <button id="submit-button" class="primary" type="submit">
            Log in
          </button>
        </form>

        <p class="auth-switch">
          <span id="switch-label">New here?</span>
          <button id="switch-mode" class="link-button" type="button">
            Create an account
          </button>
        </p>
      </section>

      <section id="workspace-view" hidden>
        <header class="topbar">
          <div class="topbar-inner">
            <div class="brand">
              <span class="brand-icon" aria-hidden="true">Q2A</span>
              <span>Question Assistant</span>
            </div>

            <nav class="header-nav" aria-label="Main navigation">
              <span>Questions</span>
              <span>Ask</span>
              <span>Drafts</span>
              <span>Admin</span>
              <span>About</span>
            </nav>

            <div class="account">
              <div class="account-pill">
                <span id="user-initial" aria-hidden="true"></span>
                <strong id="user-email"></strong>
              </div>
              <button id="logout-button" class="secondary" type="button">
                Log out
              </button>
            </div>
          </div>
        </header>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
